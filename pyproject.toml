[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "annomi-counselling-dialogue-analysis"
version = "0.1.0"
description = "Reproducible evidence package for context-aware AnnoMI dialogue analysis"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "Abdulla Huseyinli" }]
dependencies = []

[project.optional-dependencies]
analysis = [
  "ipykernel>=6.29,<7",
  "jupyterlab>=4,<5",
  "matplotlib>=3.8,<4",
  "nbclient>=0.10,<0.11",
  "nbformat>=5.10,<6",
  "pandas>=2.2,<3",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.15,<1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
