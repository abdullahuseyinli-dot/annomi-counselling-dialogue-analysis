[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "annomi-counselling-dialogue-analysis"
version = "0.2.0"
description = "Source-disjoint and disagreement-aware AnnoMI research benchmark"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
authors = [{ name = "Abdulla Huseyinli" }]
dependencies = [
  "joblib>=1.5,<2",
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.7,<2",
  "scipy>=1.15,<2",
]

[project.scripts]
annomi-research = "annomi_research.cli:main"

[project.optional-dependencies]
analysis = [
  "ipykernel>=6.29,<7",
  "jupyterlab>=4,<5",
  "matplotlib>=3.8,<4",
  "nbclient>=0.10,<0.11",
  "nbformat>=5.10,<6",
  "pandas>=2.2,<3",
]
dev = [
  "pytest>=8,<10",
  "ruff>=0.15,<1",
]
neural = [
  "accelerate>=1.10,<2",
  "datasets>=3.6,<5",
  "peft>=0.17,<1",
  "sentencepiece>=0.2,<0.3",
  "torch>=2.8,<3",
  "transformers>=4.55,<6",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["annomi_research"]

[tool.coverage.report]
show_missing = true
fail_under = 70

[tool.ruff]
line-length = 100
target-version = "py311"
