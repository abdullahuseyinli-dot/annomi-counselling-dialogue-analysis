name: Data-backed evidence audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_NO_PROGRESS: "1"

jobs:
  evidence:
    name: Pinned-data validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source without credentials
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked validation environment
        run: uv sync --locked --extra dev --extra neural-cpu

      - name: Acquire and verify pinned AnnoMI files
        run: |
          uv run python tools/download_dataset.py --variant simple
          uv run python tools/download_dataset.py --variant full

      - name: Validate research evidence against source data
        run: uv run annomi-research validate

      - name: Validate repository contracts
        run: uv run python tools/validate_repository.py
