name: Data-backed evidence audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  UV_NO_PROGRESS: "1"

jobs:
  evidence:
    name: Pinned-data validation
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked validation environment
        run: uv sync --locked --extra dev --extra neural-cpu

      - name: Acquire and verify pinned AnnoMI files
        run: |
          uv run python tools/download_dataset.py --variant simple
          uv run python tools/download_dataset.py --variant full

      - name: Validate research evidence against source data
        run: uv run annomi-research validate

      - name: Validate repository contracts
        run: uv run python tools/validate_repository.py
