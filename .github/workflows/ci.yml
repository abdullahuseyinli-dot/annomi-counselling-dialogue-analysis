name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_DATASETS_OFFLINE: "1"
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  WANDB_MODE: offline
  WANDB_DISABLED: "true"
  UV_NO_PROGRESS: "1"

jobs:
  quality:
    name: Quality (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.11"
          - os: windows-latest
            python: "3.12"

    steps:
      - name: Check out source without credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: ${{ matrix.python }}

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked test environment
        run: uv sync --locked --extra dev --extra neural-cpu

      - name: Compile Python sources
        run: uv run python -m compileall -q src tests tools

      - name: Run tests and measured coverage gate
        run: >-
          uv run python -m pytest --cov=annomi_research
          --cov-report=term-missing --cov-report=xml

      - name: Lint
        run: uv run ruff check src tests tools

      - name: Check formatting
        run: uv run ruff format --check src tests tools

      - name: Type-check
        run: uv run mypy --python-version ${{ matrix.python }}

      - name: Validate repository contracts
        run: uv run python tools/validate_repository.py

      - name: Smoke-test base command
        run: uv run annomi-research --help

      - name: Build wheel and source distribution
        run: uv build

      - name: Validate distribution contents
        run: uv run python tools/validate_distribution.py

      - name: Smoke-test clean wheel installation
        run: uv run python tools/smoke_install_distribution.py
