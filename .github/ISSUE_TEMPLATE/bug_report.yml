name: Bug report
description: Report a reproducible problem in the software or validation tools.
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Problem
      description: Describe what happened and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Provide the command, version, platform, and the smallest safe example.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Relevant evidence
      description: Link non-sensitive logs or manifests. Do not attach dialogue text or credentials.
