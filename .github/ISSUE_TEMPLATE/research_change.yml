name: Research change
description: Propose a protocol, metric, model, or reporting change.
title: "[Research] "
labels:
  - research
body:
  - type: textarea
    id: question
    attributes:
      label: Research question
      description: State the question and why the current evidence does not answer it.
    validations:
      required: true
  - type: textarea
    id: protocol
    attributes:
      label: Proposed protocol
      description: Specify data access, grouping, selection, metrics, uncertainty, and stopping rules.
    validations:
      required: true
  - type: textarea
    id: boundary
    attributes:
      label: Prior results
      description: Identify any earlier results that informed the proposal and the independent evaluation needed.
    validations:
      required: true
